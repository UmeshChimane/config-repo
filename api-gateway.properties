# Application name - identifies this service in the microservices architecture
spring.application.name=api-gateway

# Server port - the port on which this service will run
server.port=8080

# Eureka server URL - the address of the service discovery server for registration (localhost for local development)
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Eureka server URL - the address of the service discovery server for registration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka

# Gateway route 0 - route ID for product service
spring.cloud.gateway.server.webflux.routes[0].id=product-service
# Gateway route 0 - load balancer URI for product service (lb:// uses service discovery)
spring.cloud.gateway.server.webflux.routes[0].uri=lb://product-service
# Gateway route 0 - path predicate to match /products/** requests
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/products/**

# Gateway route 1 - route ID for order service
spring.cloud.gateway.server.webflux.routes[1].id=order-service
# Gateway route 1 - load balancer URI for order service (lb:// uses service discovery)
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
# Gateway route 1 - path predicate to match /orders/** requests
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/orders/**

# Gateway route 2 - route ID for inventory service
spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
# Gateway route 2 - load balancer URI for inventory service (lb:// uses service discovery)
spring.cloud.gateway.server.webflux.routes[2].uri=lb://inventory-service
# Gateway route 2 - path predicate to match /inventory/** requests
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/inventory/**