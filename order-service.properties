# Application name - identifies this service in the microservices architecture
spring.application.name=order-service

# Server port - the port on which this service will run
server.port=8082

# Database URL - JDBC connection string to MySQL database (localhost for local development)
#spring.datasource.url=jdbc:mysql://localhost:3306/order_db
# Database URL - JDBC connection string using Docker host networking
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/order_db
# Database URL - JDBC connection string to MySQL database in Docker network
spring.datasource.url=jdbc:mysql://mysql:3306/order_db

# Database username - MySQL user for authentication
spring.datasource.username=root
# Database password - MySQL password for authentication
spring.datasource.password=root@123

# Hibernate DDL auto - automatically updates database schema based on entity classes (update = create/update tables)
spring.jpa.hibernate.ddl-auto=update
# Show SQL - logs SQL queries to console for debugging
spring.jpa.show-sql=true

# Eureka server URL - the address of the service discovery server for registration (localhost for local development)
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
# Eureka server URL - the address of the service discovery server for registration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
# Circuit breaker - register health indicator for monitoring
resilience4j.circuitbreaker.instances.productService.register-health-indicator=true
# Circuit breaker - failure rate threshold percentage (50% failures triggers circuit opening)
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
# Circuit breaker - minimum number of calls before failure rate calculation (5 calls required)
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
# Circuit breaker - automatic transition from open to half-open state after wait duration
resilience4j.circuitbreaker.instances.productService.automatic-transition-from-open-to-half-open-enabled=true
# Circuit breaker - wait duration in open state before attempting recovery (10 seconds)
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
# Circuit breaker - permitted calls in half-open state to test if service is recovered (3 calls)
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3
# Circuit breaker - sliding window size for failure rate calculation (last 10 calls)
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10

# Kafka broker address - the location of the Kafka server
spring.kafka.bootstrap-servers=kafka:9092

# Key serializer - converts message keys from String to bytes before sending to Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Value serializer - converts message values from JSON objects to bytes before sending to Kafka
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer